spring:
  application:
    name: juahaki
  config:
    import: "file:keys.properties"
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_schema: public
  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: org.postgresql.Driver

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${google.client.id}
            client-secret: ${google.client.secret}
            scope: openid,profile,email
            redirect-uri: ${google.redirect.uri}
            authorization-grant-type: authorization_code
            # Enable PKCE for mobile security
            client-authentication-method: none
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  ai:
    openai:
      api-key: ${open.ai.key}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 384
    vectorstore:
      qdrant:
        enabled: true
        host: ${qdrant.host.url}
        port: 6334
        api-key: ${qdrant.api.key}
        collection-name: juahaki-kb
        use-tls: true
  data:
    redis:
      host: ${redis.host.url}
      port: ${redis.port:6380}
      password: ${redis.password}
      ssl:
        enabled: false
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8075
  servlet:
    context-path: /

firebase:
  bucket-name: ${firebase.bucket.name}
  credentials:
    path: juahaki-client.json

app:
  jwtSecret: ${jwt.secret}
  jwtExpirationMs: ${jwt.expiration.ms}
  jwtRefreshExpirationMs: ${jwt.refresh.expiration.ms}
  oauth2:
    authorizedRedirectUri: ${oauth2.authorized.redirect.uri}
    webRedirectUri: ${oauth2.web.redirect.uri}

api:
  prefix: api/v1