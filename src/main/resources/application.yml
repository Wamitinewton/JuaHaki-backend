spring:
  application:
    name: juahaki
  config:
    import:
      - "file:keys.properties"
      - "classpath:quiz-config.yml"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: org.postgresql.Driver

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${google.client.id}
            client-secret: ${google.client.secret}
            scope: openid,profile,email
            redirect-uri: ${google.redirect.uri}
            authorization-grant-type: authorization_code
            # Enable PKCE for mobile security
            client-authentication-method: none
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        compression.type: snappy
        batch.size: 16384
        linger.ms: 5
    consumer:
      group-id: ${app.kafka.consumer.group-id}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10
      properties:
        spring.json.trusted.packages: "com.juahaki.juahaki.dto.email"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000

  ai:
    openai:
      api-key: ${open.ai.key}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 384
    vectorstore:
      qdrant:
        enabled: true
        host: ${qdrant.host.url}
        port: 6334
        api-key: ${qdrant.api.key}
        collection-name: juahaki-kb
        use-tls: true
  data:
    redis:
      host: ${redis.host.url}
      port: ${redis.port:6380}
      password: ${redis.password}
      ssl:
        enabled: false
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8075
  servlet:
    context-path: /

firebase:
  bucket-name: ${firebase.bucket.name}
  credentials:
    path: juahaki-client.json

app:
  jwtSecret: ${jwt.secret}
  jwtExpirationMs: ${jwt.expiration.ms}
  jwtRefreshExpirationMs: ${jwt.refresh.expiration.ms}
  oauth2:
    authorizedRedirectUri: ${oauth2.authorized.redirect.uri}
    webRedirectUri: ${oauth2.web.redirect.uri}

    quiz:
      max-context-documents: 10
      similarity-threshold: 0.6
      document:
        processing:
          chunk-size: 1000
          chunk-overlap: 200
          max-file-size: 52428800
      async:
        core-pool-size: 5
        max-pool-size: 10
        queue-capacity: 100

  poll:
    attachments:
      max-size: 10485760
      max-count: 5
    opinion:
      attachments:
        max-size: 5242880
        max-count: 3

  kafka:
    email:
      topic: juahaki.email.events
      retry-topic: juahaki.email.retry
      dlt-topic: juahaki.email.dlt
    consumer:
      group-id: juahaki-email-service

  email:
    max-retry-attempts: 3
    from-name: JuaHaki Civic Educator
    base-url: juahaki.com
    support:
      phone: +254-700-000-000

api:
  prefix: api/v1

aws:
  accessKeyId: ${aws.access.key}
  secretKey: ${aws.secret.key}
  s3:
    bucket: ${aws.bucket.name}
  region: ${aws.region}